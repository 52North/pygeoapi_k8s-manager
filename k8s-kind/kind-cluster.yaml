kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pygeoapi-k8s-manager
nodes:
  - role: control-plane
    # Check
    #     https://github.com/kubernetes-sigs/kind/releases#user-content-new-features
    # for available versions matching you local kubectl version
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
    - containerPort: 30080
      hostPort: 30080
      protocol: TCP
    - containerPort: 30090
      hostPort: 30090
      protocol: TCP
    - containerPort: 30100
      hostPort: 30100
      protocol: TCP
