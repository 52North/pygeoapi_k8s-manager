apiVersion: v1
kind: Secret
metadata:
  name: storage-credentials
type: Opaque
stringData:
  MINIO_ROOT_USER: storage_admin
  MINIO_ROOT_PASSWORD: storage_admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
      - name: storage
        image: docker.io/pgsty/silo:latest
        args:
          - server
          - /data
          - --console-address
          - ":9001"
        envFrom:
          - secretRef:
              name: storage-credentials
        ports:
          - containerPort: 9000
          - containerPort: 9001
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          # adjust asap to your set-up
          requests:
            memory: "512M"
            cpu: "100m"
          limits:
            memory: "768M"
            cpu: "250m"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  type: NodePort
  selector:
    app: storage
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30090
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30100
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-bucket-init
spec:
  backoffLimit: 0
  parallelism: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      initContainers:
      - name: wait-for-storage
        image: busybox
        command: ['sh', '-c', 'until nc -z storage 9000; do date; echo waiting for storage; sleep 5; done;']
      containers:
      - name: create-bucket-and-path
        image: docker.io/pgsty/mc:latest
        env:
        - name: MINIO_ACCESS_KEY
          value: storage_admin
        - name: MINIO_SECRET_KEY
          value: storage_admin
        command: ["/bin/sh", "-c"]
        args:
          - |
            mc alias set mystorage http://storage:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
            mc mb --ignore-existing mystorage/test-bucket
            echo "init" | mc pipe mystorage/test-bucket/k8s-manager/logs/init.txt
        resources:
          requests:
            memory: "32M"
            cpu: "50m"
          limits:
            memory: "32M"
            cpu: "50m"
      restartPolicy: Never
