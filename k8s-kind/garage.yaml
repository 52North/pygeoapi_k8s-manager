apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: garage_admin
  AWS_SECRET_ACCESS_KEY: garage_admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:latest
        args: ["server"]
        ports:
          - containerPort: 3900
        livenessProbe:
          httpGet:
            path: /
            port: 3900
          initialDelaySeconds: 10
          periodSeconds: 20

        readinessProbe:
          httpGet:
            path: /
            port: 3900
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
          - secretRef:
              name: garage-credentials
        volumeMounts:
          - name: data
            mountPath: /var/lib/garage
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  type: NodePort
  selector:
    app: garage
  ports:
    - port: 3900
      targetPort: 3900
      nodePort: 30091
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bucket-init
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - name: init-bucket
        image: amazon/aws-cli
        env:
        - name: AWS_ACCESS_KEY_ID
          value: garage_admin
        - name: AWS_SECRET_ACCESS_KEY
          value: garage_admin
        command: ["/bin/sh", "-c"]
        args:
          - |
            sleep 10
            aws --endpoint-url=http://garage:3900 s3 mb s3://test-bucket || true
      restartPolicy: Never