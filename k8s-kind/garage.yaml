apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: garage_admin
  AWS_SECRET_ACCESS_KEY: garage_admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:latest
        args: ["server"]
        ports:
          - containerPort: 3900
        envFrom:
          - secretRef:
              name: garage-credentials
        volumeMounts:
          - name: data
            mountPath: /var/lib/garage
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  type: NodePort
  selector:
    app: garage
  ports:
    - port: 3900
      targetPort: 3900
      nodePort: 30091