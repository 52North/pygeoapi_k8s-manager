apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: garage_admin
  AWS_SECRET_ACCESS_KEY: garage_admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:latest
        args: ["server"]
        ports:
          - containerPort: 3900
          - containerPort: 3901
        envFrom:
          - secretRef:
              name: garage-credentials
        volumeMounts:
          - name: data
            mountPath: /var/lib/garage
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  type: NodePort
  selector:
    app: garage
  ports:
    - name: s3
      port: 9000
      targetPort: 3900
      nodePort: 30090
    - name: console
    # Exposes Garage admin API for inspecting bucket contents (MinIO console equivalent)
      port: 9001
      targetPort: 3901
      nodePort: 30091
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-init-bucket
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-bucket
          image: amazon/aws-cli
          command: ["/bin/sh", "-c"]
          args:
            - |
              aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID;
              aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY;
              until aws --endpoint-url=http://garage:9000 s3 ls > /dev/null 2>&1; do
                echo "Waiting for Garage to become available...";
                sleep 2;
              done;
              aws --endpoint-url=http://garage:9000 s3 mb s3://pygeoapi || true;
          envFrom:
            - secretRef:
                name: garage-credentials
