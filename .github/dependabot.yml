# Set update schedule for GitHub Actions and Python (uv) dependencies

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Check for updates to Python dependencies every week
      interval: "weekly"
    groups:
      # Bundle all uv dependency updates into a single PR to reduce noise
      uv:
        patterns:
          - "*"
    ignore:
      # s3fs (fsspec, CVE-2026-104851) in the image requires aiobotocore, which pins botocore.
      # aiobotocore 3.9.2 supports botocore < 1.43.107 only. Raise the bounds when a newer
      # aiobotocore release supports newer botocore versions.
      - dependency-name: "boto3"
        versions: [">=1.43.107"]
      - dependency-name: "botocore"
        versions: [">=1.43.107"]
