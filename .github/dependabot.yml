# Set update schedule for GitHub Actions and Python (uv) dependencies

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      # Check for updates to Python dependencies every week
      interval: "weekly"
    # Only touch pyproject.toml when a new version falls outside the declared range. Raising
    # lower bounds (e.g. botocore>=...) could exceed the botocore range pinned by aiobotocore
    # (via s3fs); uv.lock updates stay within that range automatically.
    versioning-strategy: "increase-if-necessary"
    groups:
      # Bundle all uv dependency updates into a single PR to reduce noise
      uv:
        patterns:
          - "*"
