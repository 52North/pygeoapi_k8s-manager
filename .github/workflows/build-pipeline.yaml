name: build push images of pygeoapi-k8s-manager
concurrency:
  group: pygeoapi-k8s-manager
  cancel-in-progress: true
env:
  BUILD_CONTEXT: .
  IMAGE_AUTHORS: https://52North.org/
  IMAGE_DESCRIPTION: 52°North pygeoapi with k8s-manager
  IMAGE_LICENSES: MIT
  IMAGE_TAG: 52north/pygeoapi-k8s-manager
  IMAGE_TITLE: 52°North pygeoapi with k8s-manager
  IMAGE_VENDOR: 52°North Spatial Information Research GmbH
  IMAGE_URL: https://github.com/52North/pygeoapi_k8s-manager
  METADATA_TAG_PATTERN: v(.*)
  PYGEOAPI_VERSION: 0.23.3
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Please provide a git tag value, e.g. v1.0.1"
        required: true
        type: string
        default: "v1.0.1"
  push:
    tags: ["v*"]

jobs:
  push_to_docker_hub:
    name: "pygeoapi-k8s-manager: build, scan, and publish"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ["1.33","1.34", "1.35"]
    steps:
    -
      name: Checkout Repository
      uses: actions/checkout@v6
    -
      name: Declare variables and resolve Tag
      id: vars
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          CLEAN_TAG=${GITHUB_REF_NAME#v}
          echo "TAG=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "BRANCH=build-by-tag" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == refs/heads/* ]]; then
          echo "TAG=latest" >> $GITHUB_OUTPUT
          echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
    -
      name: Set up Docker Buildkit env
      uses: docker/setup-buildx-action@v4
    -
      name: Extract metadata (tags, labels) for tagging Docker Image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: "${{ env.IMAGE_TAG }}"
        labels: |
          "org.opencontainers.image.authors=${{ env.IMAGE_AUTHORS }}"
          "org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}"
          "org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}"
          "org.opencontainers.image.title=${{ env.IMAGE_TITLE }}"
          "org.opencontainers.image.url=${{ env.IMAGE_URL }}"
          "org.opencontainers.image.vendor=${{ env.IMAGE_VENDOR }}"
        tags: |
          type=match,pattern=${{ env.METADATA_TAG_PATTERN }},group=1,value=${{ github.event.inputs.tags }}
    

    - name: Sync pyproject.toml with Matrix K8s Version
      run: |
        K8S_MAJOR=$(echo "${{ matrix.k8s_version }}" | cut -d'.' -f2)
        NEXT_MAJOR=$((K8S_MAJOR + 1))
        echo "Updating pyproject.toml to kubernetes >=$K8S_MAJOR,<$NEXT_MAJOR"
        sed -i "s/kubernetes>=[0-9]\{2\},<[0-9]\{2\}/kubernetes>=$K8S_MAJOR,<$NEXT_MAJOR/g" pyproject.toml
        grep "kubernetes" pyproject.toml
    -

      name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
    -
      name: Set up Python
      run: uv python install
    -
      name: Install the project
      run: uv sync --locked --all-extras --dev
    -
      name: Run linter and formatter
      run: |
        uv run ruff check
        uv run ruff check --select I
        uv run ruff format --diff
    -
      name: Run tests
      run: |
        uv run pytest tests/
    -
      name: Build Docker image (local for scanning)
      uses: docker/build-push-action@v7
      with:
        context: "${{ env.BUILD_CONTEXT }}"
        load: true
        push: false
        tags: ${{ env.IMAGE_TAG }}:local-scan
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GIT_BRANCH=${{ env.BRANCH }}

          GIT_COMMIT=${{ github.sha }}
          GIT_HASH=${{ github.sha }}
          GIT_TAG=${{ env.TAG }}
          VERSION=${{ env.DOCKER_METADATA_OUTPUT_VERSION }}
          PYGEOAPI_VERSION=${{ env.PYGEOAPI_VERSION }}

    -
      name: Run trivy vulnerability scanner
      # get latest version from https://github.com/aquasecurity/trivy-action/releases
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
        TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        TRIVY_DISABLE_VEX_NOTICE: "true"
      with:
        scan-type: image
        image-ref: '${{ env.IMAGE_TAG }}:local-scan'
        format: json
        output: trivy-results.json
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: os,library
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
    -
      name: Remove empty results
      run: |
        vulnerabilities=$(cat trivy-results.json | jq 'if (.Results | length) == 0 then 0 else [.Results[].Vulnerabilities | length] | add end'); \
        if [[ "$vulnerabilities" -eq 0 ]]; then \
          rm trivy-results.json
        fi
    -
      if: ${{ hashFiles('trivy-results.json') != '' }}
      name: Convert JSON to human readable table
      # get latest version from https://github.com/aquasecurity/trivy-action/releases
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_FORMAT: table
        TRIVY_DISABLE_VEX_NOTICE: "true"
      with:
        scan-type: convert
        scan-ref: trivy-results.json
        format: table
        output: trivy-results.txt
    -
      if: ${{ hashFiles('trivy-results.txt') != '' }}
      name: Send Trivy Results to Google Chat
      env:
        WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        REPO_NAME: ${{ github.repository }}
        RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        CONTENT=$(head -n 35 trivy-results.txt)
        JSON_PAYLOAD=$(jq -n \
          --arg repo "$REPO_NAME" \
          --arg content "$CONTENT" \
          --arg url "$RUN_URL" \
          '{text: "Trivy Vulnerability Scan Failed for \($repo) \n\n```\n\($content)\n```\n\n*(Results truncated. Please review full report at \($url) )*"}')
        curl -X POST -H 'Content-Type: application/json' "$WEBHOOK_URL" -d "$JSON_PAYLOAD"

    -
      if: ${{ hashFiles('trivy-results.txt') != '' }}
      name: Halt Pipeline due to Vulnerabilities
      run: |
        echo "CRITICAL or HIGH vulnerabilities found!"
        echo "Google Chat notification sent. Halting the pipeline to prevent unsafe image push."
        exit 1
    -
      name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
    -
      name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: "${{ env.BUILD_CONTEXT }}"
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        build-args: |
          GIT_COMMIT=${{ github.sha }}
          BUILD_DATE=${{ steps.vars.outputs.build_date }}
          BUILD_ID=${{ steps.vars.outputs.build_id }}
