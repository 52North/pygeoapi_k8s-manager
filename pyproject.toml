[project]
name = "pygeoapi-k8s-manager"
version = "0.30"
description = "Job manager for pygeoapi using k8s api server"
readme = "README.md"
license = { text = "Apache Software License 2.0"}
authors = [
    { name = "EHJ-52n", email = "e.h.juerrens@52north.org" },
    { name = "MartinPontius", email = "m.pontius@52north.org" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.101",
    "botocore>=1.43.101",
    "filelock>=4.2.0",
    # Client works against older clusters (only stable v1 APIs used). 37 changed the Python
    # model API (pydantic-based models, to_dict() output) and breaks this code.
    #
    # https://github.com/kubernetes-client/python#compatibility-matrix-of-supported-client-versions
    # https://github.com/kubernetes-client/python/blob/release-37.0/CHANGELOG.md#breaking-change-from-upgrading-openapi-generator-to-v7240
    #
    "kubernetes>=34,<37",
    "pygeoapi==0.24.0",
    "s3fs>=2026.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
]
