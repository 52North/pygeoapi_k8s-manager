[project]
name = "pygeoapi-k8s-manager"
version = "0.25"
description = "Job manager for pygeoapi using k8s api server"
readme = "README.md"
license = { text = "Apache Software License 2.0"}
authors = [
    { name = "EHJ-52n", email = "e.h.juerrens@52north.org" },
    { name = "MartinPontius", email = "m.pontius@52north.org" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.37",
    "botocore>=1.38.37",
    "filelock>=3",
    "kubernetes>=33,<34",
    "pygeoapi==0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "ruff>=0.11.13",
    "time-machine>=2.16.0",
]
docker = [
    "boto3>=1.38.37",
    "botocore>=1.38.37",
    "filelock>=3",
    "kubernetes>=33,<34",
]
