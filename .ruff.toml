line-length = 120

[lint]
# Pyflakes (`F`) + a subset of pycodestyle errors (`E4/E7/E9`) and warnings (`W`),
# flake8-bugbear (`B`), isort (`I`), pyupgrade (`UP`), flake8-simplify (`SIM`)
# and Ruff-specific rules (`RUF`).
select = ["E4", "E7", "E9", "F", "B", "I", "W", "UP", "SIM", "RUF"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D"]
# Ignore all files that end in `_test.py`.
"*_test.py" = ["D"]

[format]
docstring-code-format = true
